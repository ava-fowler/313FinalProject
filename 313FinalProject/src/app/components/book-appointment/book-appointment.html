<div class="container mt-4" style="max-width: 500px;">
  <h2>Book Appointment</h2>
  <p class="text-muted" *ngIf="animalName">For: <strong>{{ animalName }}</strong></p>

  <div class="form-group mb-3">
    <label>Date</label>
    <input type="date" class="form-control" [(ngModel)]="date" name="date" required />
  </div>

  <div class="form-group mb-3">
    <label>Time</label>
    <input type="time" class="form-control" [(ngModel)]="time" name="time"
           [min]="officeHours.open" [max]="officeHours.close" required />
    <small class="text-muted">Office hours: {{ officeHours.open }} - {{ officeHours.close }}</small>
  </div>

  <button class="btn btn-primary" (click)="book()" [disabled]="!date || !time">
    Confirm Appointment
  </button>
</div>

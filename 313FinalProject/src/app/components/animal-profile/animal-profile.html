<div class="card h-100 shadow-sm" style="cursor: pointer" (click)="onSelect()">
  <div class="card-img-container">
    <img *ngIf="animal.imageUrl" class="card-img-top" [src]="animal.imageUrl" alt="{{ animal.name }}" />
    <div *ngIf="!animal.imageUrl" class="card-img-top card-img-placeholder">
      <span>No Image</span>
    </div>
  </div>

  <div class="card-body">
    <h3 class="card-title fw-bold">{{ animal.name }}</h3>
    <p class="card-text text-muted">{{ animal.breed }}</p>
    <p class="card-text text-muted">{{ animal.sex }}</p>

    <div class="d-flex gap-2 mt-2">
      <button *ngIf="userRole === 'admin'" class="btn btn-warning btn-sm">Edit</button>
      <button *ngIf="userRole === 'admin'" class="btn btn-danger btn-sm">Delete</button>
    </div>
  </div>
</div>

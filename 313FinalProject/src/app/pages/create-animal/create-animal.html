<div class="container mt-4" style="max-width: 700px;">
  <h1>{{ isEditMode ? 'Edit' : 'Create New' }} Animal Profile</h1>
  <p class="text-muted">Fill in the details below.</p>

  <form (ngSubmit)="createAnimal()" #animalForm="ngForm">
    <div class="row">
      <div class="col-md-6 form-group mb-3">
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" class="form-control"
               [(ngModel)]="newAnimal.name" required />
      </div>

      <div class="col-md-6 form-group mb-3">
        <label for="species">Species</label>
        <input type="text" id="species" name="species" class="form-control"
               [(ngModel)]="newAnimal.species" placeholder="e.g. Dog, Cat" />
      </div>
    </div>

    <div class="row">
      <div class="col-md-6 form-group mb-3">
        <label for="breed">Breed *</label>
        <input type="text" id="breed" name="breed" class="form-control"
               [(ngModel)]="newAnimal.breed" required />
      </div>

      <div class="col-md-6 form-group mb-3">
        <label for="age">Age</label>
        <input type="text" id="age" name="age" class="form-control"
               [(ngModel)]="newAnimal.age" placeholder="e.g. 2 years" />
      </div>
    </div>

    <div class="form-group mb-3">
      <label for="sex">Sex *</label>
      <select id="sex" name="sex" class="form-control" [(ngModel)]="newAnimal.sex" required>
        <option value="" disabled selected>Select sex</option>
        <option value="Female">Female</option>
        <option value="Male">Male</option>
      </select>
    </div>

    <!-- NEW: Shelter Duration -->
    <div class="form-group mb-3">
      <label for="shelterDuration">At shelter for</label>
      <input type="text" id="shelterDuration" name="shelterDuration" class="form-control"
             [(ngModel)]="newAnimal.shelterDuration" placeholder="e.g. 2 months" />
    </div>

    <!-- FIXED: Changed from 'about' to 'personality' to match detail page -->
    <div class="form-group mb-3">
      <label for="personality">Personality</label>
      <textarea id="personality" name="personality" class="form-control" rows="4"
                [(ngModel)]="newAnimal.personality" placeholder="Kind, loving, energetic, etc."></textarea>
    </div>

    <div class="form-group mb-3">
      <label for="imageUrl">Image URL</label>
      <input type="text" id="imageUrl" name="imageUrl" class="form-control"
             [(ngModel)]="newAnimal.imageUrl" placeholder="https://..." />
    </div>

    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-primary" [disabled]="!animalForm.form.valid">
        {{ isEditMode ? 'Update' : 'Create' }} Profile
      </button>
      <button type="button" class="btn btn-secondary" [routerLink]="['/admin']">
        Cancel
      </button>
    </div>
  </form>
</div>

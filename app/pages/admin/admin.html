<div class="container mt-4">
  <h1 class="mb-4">Admin Dashboard</h1>

  <div class="row">
    <!-- CREATE NEW PROFILE CARD -->
    <div class="col-md-4 col-lg-3 mb-4">
      <div class="card h-100 shadow-sm d-flex align-items-center justify-content-center"
           style="min-height: 300px; cursor: pointer; border: 2px dashed #adb5bd; background: #f8f9fa;"
           [routerLink]="['/admin/create-animal']">
        <div class="text-center text-muted">
          <h1 style="font-size: 4rem; line-height: 1;">+</h1>
          <h5 class="mt-2">Create New Profile</h5>
        </div>
      </div>
    </div>

    <!-- ANIMAL CARDS -->
    <div class="col-md-4 col-lg-3 mb-4" *ngFor="let animal of animals$ | async">
      <div class="card h-100 shadow-sm">
        <img class="card-img-top" [src]="animal.imageUrl || 'https://via.placeholder.com/300x200?text=No+Image'" 
             [alt]="animal.name" style="height: 200px; object-fit: cover;">
        <div class="card-body">
          <h5 class="card-title fw-bold">{{ animal.name }}</h5>
          <p class="card-text text-muted mb-1">{{ animal.breed }}</p>
          <p class="card-text text-muted small">{{ animal.sex }} · {{ animal.species || 'Unknown' }}</p>
          <span class="badge" 
                [class.bg-success]="animal.status === 'Available'"
                [class.bg-warning]="animal.status === 'Pending'"
                [class.bg-secondary]="animal.status === 'Adopted'">
            {{ animal.status || 'Available' }}
          </span>
        </div>
        <div class="card-footer bg-white border-top-0">
          <div class="d-flex gap-2">
            <button class="btn btn-warning btn-sm flex-fill" 
                    [routerLink]="['/admin/edit-animal', animal.id]">Edit</button>
            <button class="btn btn-danger btn-sm flex-fill" 
                    (click)="deleteAnimal(animal.id)">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
